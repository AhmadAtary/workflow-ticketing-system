name: Release Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/flowdesk-app:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/flowdesk-web:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.app_image }}
            ghcr.io/${{ github.repository_owner }}/flowdesk-app:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}
            ghcr.io/${{ github.repository_owner }}/flowdesk-web:latest
