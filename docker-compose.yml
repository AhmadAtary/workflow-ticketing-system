services:
  app:
    image: ${APP_IMAGE:-flowdesk-app:local}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: >
      sh -lc "
      php artisan migrate --force &&
      php artisan db:seed --force &&
      (php artisan storage:link || true) &&
      php-fpm -F
      "
    environment:
      APP_NAME: FlowDesk API
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8082
      APP_KEY: ${APP_KEY:-base64:Wm8zL09QdjlBN3hnLzVWa3JaQkhWQzNvN1VwMGl2NzI3eG9DWGorL2tlbz0=}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-flowdesk}
      DB_USERNAME: ${DB_USERNAME:-flowdesk}
      DB_PASSWORD: ${DB_PASSWORD:-flowdesk}
      CACHE_STORE: redis
      PERMISSION_CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: attachments
      ATTACHMENTS_DISK: attachments
      CORS_ALLOWED_ORIGINS: http://localhost:8082,http://localhost:5173
      FRONTEND_URL: http://localhost:8082
      JWT_SECRET: ${JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_TTL: 15
      JWT_REFRESH_TTL: 20160
      REFRESH_TOKEN_TTL_DAYS: 14
      REFRESH_TOKEN_COOKIE_NAME: flowdesk_refresh
      MAIL_MAILER: log
      FLOWDESK_ADMIN_NAME: ${FLOWDESK_ADMIN_NAME:-Atary}
      FLOWDESK_ADMIN_EMAIL: ${FLOWDESK_ADMIN_EMAIL:-atary.avxav@gmail.com}
      FLOWDESK_ADMIN_PASSWORD: ${FLOWDESK_ADMIN_PASSWORD:-Atary@2912}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage_public:/var/www/backend/storage/app/public

  queue:
    image: ${APP_IMAGE:-flowdesk-app:local}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    environment:
      APP_NAME: FlowDesk API
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8082
      APP_KEY: ${APP_KEY:-base64:Wm8zL09QdjlBN3hnLzVWa3JaQkhWQzNvN1VwMGl2NzI3eG9DWGorL2tlbz0=}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-flowdesk}
      DB_USERNAME: ${DB_USERNAME:-flowdesk}
      DB_PASSWORD: ${DB_PASSWORD:-flowdesk}
      CACHE_STORE: redis
      PERMISSION_CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: attachments
      ATTACHMENTS_DISK: attachments
      CORS_ALLOWED_ORIGINS: http://localhost:8082,http://localhost:5173
      FRONTEND_URL: http://localhost:8082
      JWT_SECRET: ${JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_TTL: 15
      JWT_REFRESH_TTL: 20160
      REFRESH_TOKEN_TTL_DAYS: 14
      REFRESH_TOKEN_COOKIE_NAME: flowdesk_refresh
      MAIL_MAILER: log
    depends_on:
      app:
        condition: service_started
    volumes:
      - backend_storage_public:/var/www/backend/storage/app/public

  scheduler:
    image: ${APP_IMAGE:-flowdesk-app:local}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: >
      sh -lc "
      while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done
      "
    environment:
      APP_NAME: FlowDesk API
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8082
      APP_KEY: ${APP_KEY:-base64:Wm8zL09QdjlBN3hnLzVWa3JaQkhWQzNvN1VwMGl2NzI3eG9DWGorL2tlbz0=}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-flowdesk}
      DB_USERNAME: ${DB_USERNAME:-flowdesk}
      DB_PASSWORD: ${DB_PASSWORD:-flowdesk}
      CACHE_STORE: redis
      PERMISSION_CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: attachments
      ATTACHMENTS_DISK: attachments
      CORS_ALLOWED_ORIGINS: http://localhost:8082,http://localhost:5173
      FRONTEND_URL: http://localhost:8082
      JWT_SECRET: ${JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_TTL: 15
      JWT_REFRESH_TTL: 20160
      REFRESH_TOKEN_TTL_DAYS: 14
      REFRESH_TOKEN_COOKIE_NAME: flowdesk_refresh
      MAIL_MAILER: log
    depends_on:
      app:
        condition: service_started
    volumes:
      - backend_storage_public:/var/www/backend/storage/app/public

  nginx:
    image: ${WEB_IMAGE:-flowdesk-web:local}
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8082}:80"
    depends_on:
      app:
        condition: service_started
    volumes:
      - backend_storage_public:/var/www/backend/storage/app/public:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-flowdesk}
      POSTGRES_USER: ${DB_USERNAME:-flowdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowdesk}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-flowdesk} -d ${DB_DATABASE:-flowdesk}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  backend_storage_public:
